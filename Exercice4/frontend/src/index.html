<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 4 - Stack PostgreSQL + Tor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .status-bar {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .status-item {
            display: inline-block;
            margin: 5px 10px;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: 600;
        }

        .status-item.healthy {
            background: #d4edda;
            color: #155724;
        }

        .status-item.unhealthy {
            background: #f8d7da;
            color: #721c24;
        }

        .tor-info {
            font-size: 0.9em;
            color: #666;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
            margin-right: 10px;
            margin-top: 10px;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button.import {
            background: #7d4cdb;
        }

        button.import:hover {
            background: #6638b8;
        }

        button.delete {
            background: #e74c3c;
        }

        button.delete:hover {
            background: #c0392b;
        }

        button.update {
            background: #f39c12;
        }

        button.update:hover {
            background: #d68910;
        }

        .users-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .user-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            gap: 15px;
            align-items: center;
            border-left: 4px solid #667eea;
        }

        .user-item.imported {
            border-left-color: #7d4cdb;
        }

        .user-photo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-info {
            flex-grow: 1;
        }

        .user-info strong {
            color: #667eea;
        }

        .user-info small {
            color: #666;
            display: block;
            margin-top: 5px;
        }

        .user-source {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.75em;
            font-weight: 600;
            margin-top: 5px;
        }

        .user-source.manual {
            background: #d4edda;
            color: #155724;
        }

        .user-source.randomuser {
            background: #e8d4f8;
            color: #5a1f7d;
        }

        .user-actions {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
        }

        .footer-links a {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .footer-links a:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Stack PostgreSQL + Tor</h1>
            <p class="subtitle">Gestion d'utilisateurs avec import via Tor</p>
        </header>

        <div class="status-bar">
            <div>
                <span id="dbStatus" class="status-item">Checking...</span>
                <span id="backendStatus" class="status-item">Checking...</span>
                <span id="torStatus" class="status-item">Checking...</span>
            </div>
            <div class="tor-info" id="torInfo"></div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>Ajouter un utilisateur</h2>
                <div id="createMessage" class="message"></div>
                <form id="createForm">
                    <div class="form-group">
                        <label for="createUsername">Nom d'utilisateur</label>
                        <input type="text" id="createUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="createEmail">Email</label>
                        <input type="email" id="createEmail" required>
                    </div>
                    <button type="submit">Creer manuellement</button>
                </form>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">

                <h2 style="margin-top: 20px;">Importer via Tor</h2>
                <p style="color: #666; margin-bottom: 15px; font-size: 0.9em;">
                    Recuperer des utilisateurs depuis RandomUser.me via le reseau Tor
                </p>
                <button id="importBtn" class="import" onclick="importUsers()">
                    Importer 10 utilisateurs
                </button>
            </div>

            <div class="card">
                <h2>Liste des utilisateurs</h2>
                <div id="usersMessage" class="message"></div>
                <div class="users-list" id="usersList"></div>
            </div>
        </div>

        <div class="footer-links">
            <a href="http://localhost:5050" target="_blank">Ouvrir PgAdmin</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function showMessage(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = 'message show ' + (isError ? 'error' : 'success');
            setTimeout(() => {
                element.className = 'message';
            }, 5000);
        }

        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();

                if (data.status === 'healthy') {
                    document.getElementById('dbStatus').className = 'status-item healthy';
                    document.getElementById('dbStatus').textContent = 'Database: Connected';
                    document.getElementById('backendStatus').className = 'status-item healthy';
                    document.getElementById('backendStatus').textContent = 'Backend: Online';

                    if (data.tor_connected) {
                        document.getElementById('torStatus').className = 'status-item healthy';
                        document.getElementById('torStatus').textContent = 'Tor: Connected';
                        document.getElementById('torInfo').textContent = `IP de sortie Tor: ${data.tor_ip}`;
                    } else {
                        document.getElementById('torStatus').className = 'status-item unhealthy';
                        document.getElementById('torStatus').textContent = 'Tor: Disconnected';
                    }
                } else {
                    document.getElementById('dbStatus').className = 'status-item unhealthy';
                    document.getElementById('dbStatus').textContent = 'Database: Disconnected';
                }
            } catch (error) {
                document.getElementById('backendStatus').className = 'status-item unhealthy';
                document.getElementById('backendStatus').textContent = 'Backend: Offline';
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/users`);
                const data = await response.json();

                const usersList = document.getElementById('usersList');
                if (data.success && data.users.length === 0) {
                    usersList.innerHTML = '<p>Aucun utilisateur</p>';
                    return;
                }

                if (data.success) {
                    usersList.innerHTML = data.users.map(user => `
                        <div class="user-item ${user.source === 'randomuser' ? 'imported' : ''}">
                            ${user.photo_url ? `<img src="${user.photo_url}" alt="${user.username}" class="user-photo">` : ''}
                            <div class="user-info">
                                <strong>ID:</strong> ${user.id} | <strong>Username:</strong> ${user.username}
                                <br>
                                <strong>Email:</strong> ${user.email}
                                ${user.phone ? `<br><strong>Telephone:</strong> ${user.phone}` : ''}
                                ${user.location ? `<br><strong>Localisation:</strong> ${user.location}` : ''}
                                <br>
                                <span class="user-source ${user.source}">${user.source === 'manual' ? 'Cree manuellement' : 'Importe via Tor'}</span>
                                <small>Cree le: ${new Date(user.created_at).toLocaleString()}</small>
                            </div>
                            <div class="user-actions">
                                <button class="update" onclick="updateUser(${user.id})">Modifier</button>
                                <button class="delete" onclick="deleteUser(${user.id})">Supprimer</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                showMessage('usersMessage', 'Erreur lors du chargement des utilisateurs', true);
            }
        }

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('createUsername').value;
            const email = document.getElementById('createEmail').value;

            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('createMessage', 'Utilisateur cree avec succes');
                    document.getElementById('createForm').reset();
                    loadUsers();
                } else {
                    showMessage('createMessage', data.error || 'Erreur lors de la creation', true);
                }
            } catch (error) {
                showMessage('createMessage', 'Erreur de connexion au serveur', true);
            }
        });

        async function importUsers() {
            const btn = document.getElementById('importBtn');
            btn.disabled = true;
            btn.textContent = 'Import en cours via Tor...';

            try {
                const response = await fetch(`${API_URL}/import-users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ count: 10 })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('createMessage',
                        `${data.imported} utilisateurs importes via Tor (${data.skipped} ignores car deja existants)`
                    );
                    loadUsers();
                } else {
                    showMessage('createMessage', data.error || 'Erreur lors de l\'import', true);
                }
            } catch (error) {
                showMessage('createMessage', 'Erreur de connexion (Tor ou API)', true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Importer 10 utilisateurs';
            }
        }

        async function updateUser(id) {
            const username = prompt('Nouveau nom d\'utilisateur:');
            if (!username) return;

            const email = prompt('Nouvel email:');
            if (!email) return;

            try {
                const response = await fetch(`${API_URL}/users/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('usersMessage', 'Utilisateur mis a jour');
                    loadUsers();
                } else {
                    showMessage('usersMessage', data.error || 'Erreur lors de la mise a jour', true);
                }
            } catch (error) {
                showMessage('usersMessage', 'Erreur de connexion', true);
            }
        }

        async function deleteUser(id) {
            if (!confirm('Etes-vous sur de vouloir supprimer cet utilisateur?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/users/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('usersMessage', 'Utilisateur supprime');
                    loadUsers();
                } else {
                    showMessage('usersMessage', data.error || 'Erreur lors de la suppression', true);
                }
            } catch (error) {
                showMessage('usersMessage', 'Erreur de connexion', true);
            }
        }

        checkHealth();
        loadUsers();
        setInterval(checkHealth, 10000);
        setInterval(loadUsers, 5000);
    </script>
</body>

</html>
