services:
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    # Plus de ports exposés ici
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80" # On expose le port 80 de Nginx sur le 3000 de l'hôte
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
