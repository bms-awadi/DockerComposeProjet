services:
  tor:
    image: dperson/torproxy
    container_name: tor
    restart: unless-stopped
    # Ports 9050/9051 ne sont plus exposés sur l'hôte (sécurité)
    volumes:
      - ./tor/torrc:/etc/tor/torrc
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      - tor
    environment:
      - TOR_PROXY=socks5h://tor:9050
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80" # On utilise le port standard 80 de Nginx
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
