services:
  tor:
    image: dperson/torproxy
    container_name: tor
    restart: unless-stopped
    ports:
      - "9050:9050"
      - "9051:9051"
    volumes:
      - ./tor/torrc:/etc/tor/torrc
    networks:
      - tor-network

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - tor
    environment:
      - TOR_PROXY=socks5h://tor:9050
    networks:
      - tor-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - tor-network

networks:
  tor-network:
    driver: bridge
