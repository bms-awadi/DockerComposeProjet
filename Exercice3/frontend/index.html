<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 3 - Random Users via Tor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .status.connected {
            background: rgba(46, 204, 113, 0.3);
        }

        .status.disconnected {
            background: rgba(231, 76, 60, 0.3);
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            background: white;
            color: #1e3c72;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 0 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .user-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeIn 0.5s ease-in;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: block;
            border: 4px solid #1e3c72;
            object-fit: cover;
        }

        .user-info {
            text-align: center;
        }

        .user-name {
            font-size: 1.4em;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .user-detail {
            color: #555;
            margin: 5px 0;
            font-size: 0.9em;
        }

        .user-detail strong {
            color: #1e3c72;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }

        .error {
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .tor-badge {
            display: inline-block;
            background: #7d4cdb;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .users-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Random Users via Tor Network</h1>
            <p>Récupération d'utilisateurs aléatoires via le réseau Tor</p>
        </header>

        <div id="status" class="status">
            <p>Vérification de la connexion Tor...</p>
        </div>

        <div class="controls">
            <button id="loadUsers" onclick="loadUsers()">Charger 10 utilisateurs</button>
            <button id="loadSingleUser" onclick="loadSingleUser()">Charger 1 utilisateur</button>
            <button id="checkTor" onclick="checkTorConnection()">Vérifier connexion Tor</button>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="loading" class="loading" style="display: none;">Chargement via Tor...</div>
        <div id="usersGrid" class="users-grid"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('loadUsers').disabled = show;
            document.getElementById('loadSingleUser').disabled = show;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function updateStatus(connected, exitIp = null) {
            const statusDiv = document.getElementById('status');
            if (connected) {
                statusDiv.className = 'status connected';
                statusDiv.innerHTML = `
                    <p><strong>Statut:</strong> Connecté au réseau Tor</p>
                    ${exitIp ? `<p><strong>IP de sortie Tor:</strong> ${exitIp}</p>` : ''}
                `;
            } else {
                statusDiv.className = 'status disconnected';
                statusDiv.innerHTML = '<p><strong>Statut:</strong> Déconnecté du réseau Tor</p>';
            }
        }

        async function checkTorConnection() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();

                if (data.tor_connected) {
                    updateStatus(true, data.exit_ip);
                } else {
                    updateStatus(false);
                    showError('Impossible de se connecter au réseau Tor');
                }
            } catch (error) {
                updateStatus(false);
                showError('Erreur lors de la vérification de la connexion Tor');
            }
        }

        async function loadUsers() {
            showLoading(true);
            document.getElementById('usersGrid').innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/users`);
                const data = await response.json();

                if (data.success) {
                    displayUsers(data.users);
                } else {
                    showError(data.error || 'Erreur lors du chargement des utilisateurs');
                }
            } catch (error) {
                showError('Erreur de connexion au serveur');
            } finally {
                showLoading(false);
            }
        }

        async function loadSingleUser() {
            showLoading(true);

            try {
                const response = await fetch(`${API_URL}/user`);
                const data = await response.json();

                if (data.success) {
                    displayUsers([data.user]);
                } else {
                    showError(data.error || 'Erreur lors du chargement de l\'utilisateur');
                }
            } catch (error) {
                showError('Erreur de connexion au serveur');
            } finally {
                showLoading(false);
            }
        }

        function displayUsers(users) {
            const grid = document.getElementById('usersGrid');

            grid.innerHTML = users.map(user => `
                <div class="user-card">
                    <img src="${user.photo}" alt="${user.name}" class="user-photo">
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-detail"><strong>Email:</strong> ${user.email}</div>
                        <div class="user-detail"><strong>Téléphone:</strong> ${user.phone}</div>
                        <div class="user-detail"><strong>Localisation:</strong> ${user.location}</div>
                        <div class="tor-badge">Via Tor Network</div>
                    </div>
                </div>
            `).join('');
        }

        checkTorConnection();
    </script>
</body>

</html>
