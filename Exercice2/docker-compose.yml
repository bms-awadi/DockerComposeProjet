services:
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    # On ne publie plus le port 5000 sur l'hôte
    volumes:
      - db-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/users.db
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80" # Port unique d'accès pour l'utilisateur
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
